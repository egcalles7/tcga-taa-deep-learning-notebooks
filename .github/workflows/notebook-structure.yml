name: notebook-structure
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install nbformat
      - name: Validate notebooks and compile Python cells
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import nbformat
          root = Path("notebooks")
          for f in sorted(root.glob("*.ipynb")):
              nb = nbformat.read(f, as_version=4)
              nbformat.validate(nb)
              for cell in nb.cells:
                  if cell.cell_type != "code": continue
                  code = cell.source
                  # IPython magics are legal in Jupyter but not regular Python.
                  filtered = "\n".join(s for s in code.splitlines() if not s.lstrip().startswith(("%","!")))
                  ast.parse(filtered, filename=str(f))
              print("OK", f.name)
          PY
